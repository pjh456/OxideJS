[build]
# sccache 编译缓存：重复构建（切分支、profile 变动、clean 后重编）命中缓存直接
# 复用产物，跳过 rustc。缓存目录默认 ~/.cache/sccache（上限 10G）。
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
# mold 链接器：并行链接，比 GNU ld 快 5 至 10 倍。走 cc 驱动的 -fuse-ld=mold
# （不能直接 linker="mold"：rustc 会把 cc 驱动参数 -m64/-Wl, 原样传给 mold，
# mold 不认）。对 dev 与 release 全 profile 生效。CI 由 setup-tools 从工作副本
# 剥掉此行（sccache 包装 rustc 时链接子进程定位不到 mold）。
#
# 不设 target-cpu 指令集档位：native 与 x86-64-v3 经同机交替 A/B 实测对本解释器
# 无收益（差异在 ±2% 噪声内），解释器为分支/指针密集，吃不到 SIMD 红利。
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
