# Standalone workspace root: this vendored crate is built and tested on its own
# (standalone `cargo build` / `cargo test` in this directory), not as a member
# of the host workspace that vendors it. The empty table keeps it out of the
# parent workspace's member resolution.
[workspace]

[package]
name = "regress"
version = "0.11.1"
authors = ["ridiculousfish <corydoras@ridiculousfish.com>"]
description = "A regular expression engine targeting EcmaScript syntax"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ridiculousfish/regress"
keywords = ["regex", "regexp"]
edition = "2024"
readme = "README.md"

[features]
default = ["backend-pikevm", "std"]

std = ["memchr/std"]

# Enables the PikeVM backend.
backend-pikevm = []

# Prefers indexes to pointers for bytecode IP and string positions, for the paranoid.
index-positions = []

# Prohibits all uses of unsafe code, for the paranoid.
prohibit-unsafe = []

# Enables UTF-16 support. Byte-literal optimization is decided per compilation
# (runtime gate), so enabling this feature no longer degrades the str path.
utf16 = []

# Enables Pattern trait implementation for str::find, str::contains, etc.
pattern = []

[dependencies]
hashbrown = "0.16.0"
memchr = { version = "2.4.0", default-features = false }
